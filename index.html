<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Moghar — AI Engineer | GenAI · RAG · LLM Systems</title>
<meta name="description" content="Ali Moghar — AI Engineer specialised in LLM, RAG and multi-agent systems. Builder of VIALAB, a full-stack AI platform for critical railway telephony validation at SNCF Réseau. Available from September 2026, open to relocation across Germany.">
<meta name="keywords" content="AI Engineer, KI-Ingenieur, Ingénieur IA, GenAI, RAG, LangChain, LangGraph, LLM, FastAPI, React Js, PostgreSQL, Docker, MLOps, Fine-tuning, Microservices">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A1622'/><circle cx='50' cy='50' r='22' fill='%23FFB01F'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0A1622;
    --ink-panel:#12243A;
    --paper:#EDF1F4;
    --paper-card:#FFFFFF;
    --signal:#FFB01F;
    --signal-live:#35C77B;
    --muted:#6E8195;
    --muted-dark:#8FA3B8;
    --hair:rgba(10,22,34,.14);
    --hair-dark:rgba(255,255,255,.14);

    --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --pad:clamp(1.25rem, 5vw, 5rem);
    --maxw:1180px;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:74px}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-weight:350; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  img{max-width:100%; display:block}

  .wrap{max-width:var(--maxw); margin:0 auto; padding-left:var(--pad); padding-right:var(--pad)}

  /* ---------- utility type ---------- */
  .mono{font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase}
  .eyebrow{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:.6rem; margin:0 0 1.1rem;
  }
  .eyebrow::before{content:""; width:26px; height:2px; background:var(--signal); flex:none}

  h2.sec-title{
    font-family:var(--display); font-weight:700; letter-spacing:-.02em;
    font-size:clamp(1.6rem, 3.4vw, 2.4rem); margin:0 0 2.2rem; line-height:1.1;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50; background:rgba(10,22,34,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--hair-dark); color:#fff;
  }
  .topbar-in{
    max-width:var(--maxw); margin:0 auto; padding:.7rem var(--pad);
    display:flex; align-items:center; gap:1.4rem;
  }
  .brand{
    font-family:var(--display); font-weight:800; letter-spacing:.02em;
    text-decoration:none; font-size:.95rem; white-space:nowrap;
  }
  .brand span{color:var(--signal)}
  .site-nav{display:flex; gap:1.3rem; margin-left:auto; flex-wrap:wrap}
  .site-nav a{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; color:var(--muted-dark); padding:.35rem 0; border-bottom:2px solid transparent;
    transition:color .18s, border-color .18s;
  }
  .site-nav a:hover{color:#fff; border-bottom-color:var(--signal)}

  @media(max-width:900px){
    html{scroll-padding-top:108px}
    .topbar-in{flex-wrap:wrap; gap:.6rem 1rem; padding-top:.6rem; padding-bottom:.5rem}
    .site-nav{
      order:3; flex-basis:100%; margin-left:0; flex-wrap:nowrap;
      overflow-x:auto; gap:1.15rem; -ms-overflow-style:none; scrollbar-width:none;
    }
    .site-nav::-webkit-scrollbar{display:none}
    .site-nav a{white-space:nowrap}
    .lang{margin-left:auto}
  }

  .lang{display:flex; border:1px solid var(--hair-dark); flex:none}
  .lang button{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    background:none; border:0; color:var(--muted-dark); padding:.42rem .62rem; cursor:pointer;
    transition:background .18s, color .18s;
  }
  .lang button + button{border-left:1px solid var(--hair-dark)}
  .lang button:hover{color:#fff}
  .lang button[aria-pressed="true"]{background:var(--signal); color:var(--ink); font-weight:600}

  /* ---------- hero ---------- */
  .hero{background:var(--ink); color:#fff; padding:clamp(3.5rem,9vw,7rem) 0 clamp(2.5rem,6vw,4rem)}
  .hero-name{
    font-family:var(--display); font-weight:800; text-transform:uppercase;
    font-size:clamp(2.8rem, 11vw, 7rem); line-height:.9; letter-spacing:-.035em; margin:0;
  }
  .hero-role{
    font-family:var(--mono); font-size:clamp(.8rem,1.8vw,1rem); letter-spacing:.08em;
    color:var(--signal); margin:1.3rem 0 0; min-height:1.6em;
  }
  .hero-role .caret{
    display:inline-block; width:.55em; height:1.05em; background:var(--signal);
    vertical-align:-.16em; margin-left:.18em; animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .hero-lede{
    max-width:60ch; margin:1.8rem 0 0; color:#CBD8E4; font-size:clamp(1rem,1.6vw,1.1rem); font-weight:300;
  }
  .hero-lede strong{color:#fff; font-weight:500}

  /* departure-board status strip */
  .board{
    margin-top:2.4rem; border:1px solid var(--hair-dark); background:var(--ink-panel);
    display:flex; flex-wrap:wrap; align-items:stretch;
  }
  .board-cell{padding:.85rem 1.1rem; display:flex; align-items:center; gap:.6rem; flex:1 1 auto}
  .board-cell + .board-cell{border-left:1px solid var(--hair-dark)}
  .board-k{font-family:var(--mono); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-dark)}
  .board-v{font-family:var(--mono); font-size:.82rem; letter-spacing:.06em; color:#fff; font-weight:500}
  .board-v.amber{color:var(--signal)}
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:var(--signal-live); flex:none;
    box-shadow:0 0 0 0 rgba(53,199,123,.6); animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(53,199,123,.55)}
    70%{box-shadow:0 0 0 9px rgba(53,199,123,0)}
    100%{box-shadow:0 0 0 0 rgba(53,199,123,0)}
  }

  .stack-strip{margin-top:1.6rem; display:flex; flex-wrap:wrap; gap:.4rem}
  .chip-dark{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.05em; color:#D6E2ED;
    border:1px solid var(--hair-dark); padding:.32rem .6rem; white-space:nowrap;
  }
  .hero-cta{margin-top:2.2rem; display:flex; flex-wrap:wrap; gap:.7rem}
  .btn{
    font-family:var(--mono); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase;
    text-decoration:none; padding:.75rem 1.25rem; border:1px solid var(--signal); color:var(--ink);
    background:var(--signal); font-weight:600; transition:transform .16s, background .16s, color .16s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:none; color:#fff; border-color:var(--hair-dark)}
  .btn.ghost:hover{border-color:#fff}

  /* ---------- sections ---------- */
  .band{padding:clamp(3.2rem,7vw,5.5rem) 0; border-bottom:1px solid var(--hair)}
  .band-dark{background:var(--ink); color:#fff; border-bottom:0}
  .band-dark .eyebrow{color:var(--muted-dark)}

  /* about */
  .about-grid{display:grid; grid-template-columns:1fr; gap:2.4rem}
  @media(min-width:860px){.about-grid{grid-template-columns:1.55fr 1fr; gap:3.5rem}}
  .about-text p{margin:0 0 1.1rem; font-size:1.05rem; max-width:64ch}
  .about-text p:last-child{margin-bottom:0}
  .about-text strong{font-weight:600}

  .facts{border-top:2px solid var(--ink)}
  .fact{display:flex; gap:1rem; padding:.8rem 0; border-bottom:1px solid var(--hair); align-items:baseline}
  .fact-k{font-family:var(--mono); font-size:.68rem; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); flex:0 0 42%}
  .fact-v{font-size:.94rem; font-weight:500}
  .fact-v a{text-decoration:none; border-bottom:1px solid var(--signal)}

  /* experience rail */
  .rail{position:relative; padding-left:2.6rem}
  .rail::before{
    content:""; position:absolute; left:7px; top:.6rem; bottom:.6rem; width:2px;
    background:linear-gradient(180deg, var(--signal) 0 64px, rgba(255,255,255,.2) 64px);
  }
  .stop{position:relative; padding-bottom:2.6rem}
  .stop:last-child{padding-bottom:0}
  .stop-node{
    position:absolute; left:-2.6rem; top:.35rem; width:16px; height:16px; border-radius:50%;
    background:var(--ink); border:2px solid rgba(255,255,255,.35);
  }
  .stop.is-current .stop-node{
    background:var(--signal); border-color:var(--signal);
    box-shadow:0 0 0 0 rgba(255,176,31,.55); animation:pulse-amber 2.6s ease-out infinite;
  }
  @keyframes pulse-amber{
    0%{box-shadow:0 0 0 0 rgba(255,176,31,.5)}
    70%{box-shadow:0 0 0 12px rgba(255,176,31,0)}
    100%{box-shadow:0 0 0 0 rgba(255,176,31,0)}
  }
  .stop-meta{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.13em; text-transform:uppercase;
    color:var(--signal); display:flex; flex-wrap:wrap; gap:.5rem .9rem; align-items:center;
  }
  .badge-live{
    background:var(--signal-live); color:var(--ink); padding:.1rem .45rem; font-weight:600; letter-spacing:.1em;
  }
  .stop-role{
    font-family:var(--display); font-weight:600; letter-spacing:-.01em;
    font-size:clamp(1.05rem,2.1vw,1.35rem); margin:.55rem 0 .2rem; line-height:1.25;
  }
  .stop-org{font-family:var(--body); font-size:.92rem; color:var(--muted-dark); margin:0 0 .9rem}
  .stop-list{margin:0; padding-left:1.05rem; color:#C8D6E3; font-weight:300}
  .stop-list li{margin-bottom:.45rem; font-size:.96rem}
  .stop-list strong{color:#fff; font-weight:500}
  .stop-stack{margin-top:.9rem; display:flex; flex-wrap:wrap; gap:.35rem}

  /* projects */
  .proj-grid{display:grid; grid-template-columns:1fr; gap:1.2rem}
  @media(min-width:720px){.proj-grid{grid-template-columns:repeat(2,1fr)}}
  .proj{
    background:var(--paper-card); border:1px solid var(--hair); padding:1.5rem 1.5rem 1.35rem;
    display:flex; flex-direction:column; transition:transform .18s, border-color .18s;
  }
  .proj:hover{transform:translateY(-3px); border-color:var(--ink)}
  .proj-top{display:flex; justify-content:space-between; align-items:baseline; gap:1rem}
  .proj-date{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:var(--muted); white-space:nowrap}
  .proj-name{font-family:var(--display); font-weight:600; font-size:1.1rem; margin:.5rem 0 .1rem; letter-spacing:-.01em}
  .proj-ctx{font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--signal-live); margin:0 0 .7rem}
  .proj-desc{margin:0 0 1rem; font-size:.95rem; color:#3B4C5D}
  .proj-foot{margin-top:auto; display:flex; flex-wrap:wrap; gap:.35rem; align-items:center}
  .chip{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.04em; color:#33475A;
    border:1px solid var(--hair); padding:.26rem .5rem; background:#F5F8FA; white-space:nowrap;
  }
  .repo{
    margin-left:auto; font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; border-bottom:2px solid var(--signal); padding-bottom:1px; white-space:nowrap;
  }

  /* skills */
  .skill-grid{display:grid; grid-template-columns:1fr; gap:0; border-top:2px solid var(--ink)}
  .skill-row{padding:1.15rem 0; border-bottom:1px solid var(--hair); display:grid; grid-template-columns:1fr; gap:.7rem}
  @media(min-width:820px){.skill-row{grid-template-columns:230px 1fr; gap:1.5rem; align-items:start}}
  .skill-k{font-family:var(--mono); font-size:.72rem; letter-spacing:.13em; text-transform:uppercase; font-weight:500; padding-top:.2rem}
  .skill-v{display:flex; flex-wrap:wrap; gap:.35rem}

  /* education + certifications */
  .two-col{display:grid; grid-template-columns:1fr; gap:3rem}
  @media(min-width:900px){.two-col{grid-template-columns:1.25fr 1fr; gap:4rem}}
  .edu{border-top:2px solid var(--ink)}
  .edu-item{padding:1.05rem 0; border-bottom:1px solid var(--hair)}
  .edu-date{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:var(--muted)}
  .edu-deg{font-family:var(--display); font-weight:600; font-size:1.02rem; margin:.3rem 0 .12rem}
  .edu-school{font-size:.9rem; color:#4C5F72}

  .cert{border-top:2px solid var(--ink)}
  .cert-item{padding:.9rem 0; border-bottom:1px solid var(--hair); display:flex; gap:1rem; align-items:baseline}
  .cert-date{font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; color:var(--muted); flex:none; width:62px}
  .cert-name{font-size:.94rem; font-weight:500}
  .cert-tag{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    background:var(--signal); color:var(--ink); padding:.1rem .4rem; margin-left:.45rem; font-weight:600; white-space:nowrap;
  }

  .lang-list{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:2.4rem}
  .lang-pill{border:1px solid var(--hair); padding:.55rem .85rem; background:var(--paper-card); min-width:110px}
  .lang-pill b{display:block; font-family:var(--display); font-weight:600; font-size:.95rem}
  .lang-pill span{font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; color:var(--muted)}

  /* contact */
  .contact-grid{display:grid; grid-template-columns:1fr; gap:2.5rem; align-items:start}
  @media(min-width:820px){.contact-grid{grid-template-columns:1.1fr 1fr; gap:4rem}}
  .contact-lede{font-size:clamp(1.15rem,2.4vw,1.6rem); font-family:var(--display); font-weight:500; letter-spacing:-.015em; margin:0 0 1.4rem; max-width:22ch; line-height:1.25}
  .contact-sub{color:#C0D0DE; font-weight:300; max-width:46ch; margin:0}
  .contact-list{border-top:1px solid var(--hair-dark)}
  .contact-row{
    display:flex; gap:1rem; padding:.95rem 0; border-bottom:1px solid var(--hair-dark);
    align-items:baseline; text-decoration:none;
  }
  .contact-row .k{font-family:var(--mono); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted-dark); flex:0 0 86px}
  .contact-row .v{font-size:.95rem; transition:color .16s}
  .contact-row:hover .v{color:var(--signal)}

  footer{background:var(--ink); color:var(--muted-dark); padding:2rem 0 2.6rem; border-top:1px solid var(--hair-dark)}
  .foot-in{display:flex; flex-wrap:wrap; gap:1rem; justify-content:space-between; font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase}

  :focus-visible{outline:2px solid var(--signal); outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
  }
  @media print{
    .topbar,.hero-cta,.lang{display:none}
    body{background:#fff}
    .band-dark,.hero,footer{background:#fff !important; color:#000 !important}
    .stop-list,.contact-sub{color:#222 !important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top">MOGHAR<span>.</span>ALI</a>
    <nav class="site-nav" id="siteNav" aria-label="Main"></nav>
    <div class="lang" id="langSwitch" role="group" aria-label="Language">
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-set-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-set-lang="de" aria-pressed="false">DE</button>
    </div>
  </div>
</header>

<section class="hero" id="top">
  <div class="wrap">
    <h1 class="hero-name">Moghar     Ali</h1>
    <p class="hero-role"><span id="typedRole"></span><span class="caret" aria-hidden="true"></span></p>
    <p class="hero-lede" id="heroLede"></p>

    <div class="board" id="board"></div>

    <div class="stack-strip" id="heroStack"></div>

    <div class="hero-cta">
      <!-- Remplace ce lien par ton CV à jour (Drive / PDF) -->
      <a class="btn" id="ctaResume" href="https://drive.google.com/file/d/1ZaHWqnRFjVMDVDb7_MkbNSA_N38Rxg1i/view?usp=sharing" target="_blank" rel="noopener"></a>
      <a class="btn ghost" id="ctaContact" href="#contact"></a>
    </div>
  </div>
</section>

<main>
  <section class="band" id="about">
    <div class="wrap">
      <p class="eyebrow" id="ey-about"></p>
      <h2 class="sec-title" id="t-about"></h2>
      <div class="about-grid">
        <div class="about-text" id="aboutText"></div>
        <div class="facts" id="facts"></div>
      </div>
    </div>
  </section>

  <section class="band band-dark" id="experience">
    <div class="wrap">
      <p class="eyebrow" id="ey-exp"></p>
      <h2 class="sec-title" id="t-exp"></h2>
      <div class="rail" id="rail"></div>
    </div>
  </section>

  <section class="band" id="projects">
    <div class="wrap">
      <p class="eyebrow" id="ey-proj"></p>
      <h2 class="sec-title" id="t-proj"></h2>
      <div class="proj-grid" id="projGrid"></div>
    </div>
  </section>

  <section class="band" id="skills">
    <div class="wrap">
      <p class="eyebrow" id="ey-skills"></p>
      <h2 class="sec-title" id="t-skills"></h2>
      <div class="skill-grid" id="skillGrid"></div>
    </div>
  </section>

  <section class="band" id="education">
    <div class="wrap">
      <div class="two-col">
        <div>
          <p class="eyebrow" id="ey-edu"></p>
          <h2 class="sec-title" id="t-edu"></h2>
          <div class="edu" id="eduList"></div>
        </div>
        <div>
          <p class="eyebrow" id="ey-cert"></p>
          <h2 class="sec-title" id="t-cert"></h2>
          <div class="cert" id="certList"></div>
          <p class="eyebrow" style="margin-top:2.6rem" id="ey-langs"></p>
          <div class="lang-list" id="langList"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="band band-dark" id="contact">
    <div class="wrap">
      <p class="eyebrow" id="ey-contact"></p>
      <div class="contact-grid">
        <div>
          <p class="contact-lede" id="contactLede"></p>
          <p class="contact-sub" id="contactSub"></p>
        </div>
        <div class="contact-list" id="contactList"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-in">
    <span>© <span id="year"></span> Ali Moghar</span>
    <span id="footNote"></span>
  </div>
</footer>

<script>

/* rotating role line */
let typeTimer = null;
function startTyping(){
  clearTimeout(typeTimer);
  const target = el("typedRole");
  const list = UI.roles[lang] || UI.roles.en;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    target.textContent = list[0];
    return;
  }
  let i = 0, j = 0, deleting = false;
  const tick = () => {
    const word = list[i];
    target.textContent = deleting ? word.slice(0, --j) : word.slice(0, ++j);
    let wait = deleting ? 32 : 62;
    if (!deleting && j === word.length){ deleting = true; wait = 1700; }
    else if (deleting && j === 0){ deleting = false; i = (i + 1) % list.length; wait = 260; }
    typeTimer = setTimeout(tick, wait);
  };
  tick();
}

function setLang(next){
  lang = ["en","fr","de"].includes(next) ? next : "en";
  document.documentElement.lang = lang;
  document.documentElement.setAttribute("data-lang", lang);
  document.querySelectorAll("[data-set-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.setLang === lang)));
  renderNav(); renderHero(); renderAbout(); renderExperience();
  renderProjects(); renderSkills(); renderEducation(); renderContact();
  startTyping();
}

document.getElementById("langSwitch").addEventListener("click", e => {
  const btn = e.target.closest("[data-set-lang]");
  if (btn) setLang(btn.dataset.setLang);
});

el("year").textContent = new Date().getFullYear();

/* language from URL (?lang=de) → browser preference → English */
const urlLang = new URLSearchParams(location.search).get("lang");
const navLang = (navigator.language || "en").slice(0, 2).toLowerCase();
setLang(urlLang || (["de","fr"].includes(navLang) ? navLang : "en"));
</script>
